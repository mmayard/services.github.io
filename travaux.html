  <script>
    // Vignette qui suit le curseur au survol de chaque titre,
    // et ouverture du lien (vidéo Vimeo) dans un nouvel onglet au clic.
    (function () {
      var list = document.getElementById('projectList');
      var preview = document.getElementById('hoverPreview');
      var previewImg = document.getElementById('hoverPreviewImg');

      if (!list || !preview || !previewImg) return;

      var links = list.querySelectorAll('.project-link');

      links.forEach(function (link) {
        link.addEventListener('mouseenter', function () {
          var img = link.getAttribute('data-img');
          if (img) {
            previewImg.src = img;
            preview.classList.add('visible');
          }
        });
        link.addEventListener('mouseleave', function () {
          preview.classList.remove('visible');
        });
      });

      document.addEventListener('mousemove', function (e) {
        preview.style.left = e.clientX + 'px';
        preview.style.top = e.clientY + 'px';
      });
    })();
  </script>
